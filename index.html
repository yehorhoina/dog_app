<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog API - Випадкові Собачки</title>
    <link rel="stylesheet" href="style.css"> <script src="app.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Песик дня</h1>
        <div class="card">
            <div id="image-container">
                <p id="status-text">Натисніть кнопку, щоб побачити собачку</p>
                <img id="dog-image" src="" alt="Собачка" style="display: none;">
            </div>
            <select id="breed-list">
                <option value="">Усі породи (випадково)</option>
            </select>
            <button id="btn">Отримати нове фото</button>
        </div>
    </div>
</body>
</html>
